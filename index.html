<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مصحف التدبر">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="قراءة القرآن الكريم بالرسم العثماني مع تفسير الميسر والسعدي وابن كثير وتلاوة سعد الغامدي.">
<link rel="preload" href="fonts/amiri-quran.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:"Amiri Quran";src:url(fonts/amiri-quran.woff2) format("woff2");font-display:swap}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>مصحف التدبر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Noto+Naskh+Arabic:wght@400;600;700&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: one reading column (max ~760px). Black/white ground, gold reserved for ornament and active states.
   Home opens on a black "mushaf cover" band; reader has a sticky bar with a gold reading-progress line. */
:root{
  --bg:#fafaf8; --surface:#ffffff; --ink:#0b0b0b; --muted:#4f4d47; --line:#e1ddd4; --line-strong:#c9c4b8;
  --gold:#b08c3a; --gold-strong:#8f6f25; --gold-soft:#f6efdd; --hl:#f7eed2; --rd:rgba(176,140,58,.30);
  --cover:#0d0d0c; --cover-ink:#f6f4ee; --cover-muted:#b9b4a6;
  --solid:#0f0f0f; --solid-ink:#ffffff;
  --f-quran:"Amiri Quran","Amiri","Traditional Arabic",serif;
  --f-body:"Noto Naskh Arabic","Geeza Pro","Arial",sans-serif;
  --f-head:"Amiri","Noto Naskh Arabic",serif;
  --qsize:1.75rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0a0a; --surface:#151513; --ink:#faf8f3; --muted:#c3beb2; --line:#2c2a26; --line-strong:#48453e;
  --gold:#d6b46a; --gold-strong:#e4c789; --gold-soft:#1e1a10; --hl:#262013; --rd:rgba(214,180,106,.30);
  --cover:#000000; --cover-ink:#f6f4ee; --cover-muted:#a8a395;
  --solid:#f3f1ec; --solid-ink:#0a0a0a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0a0a; --surface:#151513; --ink:#faf8f3; --muted:#c3beb2; --line:#2c2a26; --line-strong:#48453e;
  --gold:#d6b46a; --gold-strong:#e4c789; --gold-soft:#1e1a10; --hl:#262013; --rd:rgba(214,180,106,.30);
  --cover:#000000; --cover-ink:#f6f4ee; --cover-muted:#a8a395;
  --solid:#f3f1ec; --solid-ink:#0a0a0a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.8;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:8px;padding-block:9px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-weight:700;font-size:1.08rem;color:var(--ink);background:none;border:0;padding:0;white-space:nowrap}
.brand .star{width:22px;height:22px;flex:none}
.bar .title{flex:1;min-width:0;text-align:center;font-family:var(--f-quran);font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:border-color .2s,color .2s}
.ib:hover{border-color:var(--gold);color:var(--gold-strong)}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.ib[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}
.progress{position:absolute;inset:auto 0 -1px 0;height:2px;background:transparent}
.progress i{display:block;height:100%;width:0;background:var(--gold);transition:width .15s linear;margin-inline-start:0}

/* Home: black cover band */
.cover{background:var(--cover);color:var(--cover-ink);position:relative;overflow:hidden}
.cover .wrap{padding-block:28px 26px;position:relative}
.frame{border:1px solid var(--gold);padding:5px;border-radius:18px}
.frame-in{border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:14px;padding:26px 18px 20px;text-align:center;
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--gold) 14%,transparent),transparent 60%)}
.orn{width:56px;height:56px;margin:0 auto 6px;display:block}
.cover h1{font-family:var(--f-quran);font-weight:400;font-size:2.4rem;line-height:1.5;margin:0;color:var(--cover-ink)}
.cover p{margin:2px 0 0;color:var(--cover-muted);font-size:.95rem}
.continue{display:flex;align-items:center;gap:12px;margin:20px auto 0;max-width:420px;padding:12px 16px;border-radius:12px;background:var(--gold);color:#111;border:0;width:100%;text-align:right;transition:transform .15s}
.continue:hover{transform:translateY(-1px)}
.purpose{font-family:var(--f-head);font-weight:700;font-size:1.15rem;color:var(--gold-strong);margin:10px 0 0!important}
.continue.learn{background:var(--solid);color:var(--solid-ink);border:1px solid var(--gold)}
.continue.learn .ic{flex:none;width:38px;height:38px;border-radius:50%;background:var(--gold);color:#111;display:grid;place-items:center}
.continue.learn .ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
.continue.learn>div{flex:1;min-width:0}.continue.learn .bar{display:block;height:4px;border-radius:9px;background:color-mix(in srgb,var(--solid-ink) 18%,transparent);margin-top:7px;overflow:hidden}
.continue.learn .bar i{display:block;height:100%;background:var(--gold);border-radius:9px}
.continue.learn+.continue{margin-top:10px}
.continue b{display:block;font-family:var(--f-head);font-weight:700;font-size:1rem}
.continue span{font-size:.88rem;opacity:.8}
.continue .go{margin-inline-start:auto;font-size:1.4rem;opacity:1}
.stats{display:flex;justify-content:center;gap:22px;margin-top:16px;color:var(--cover-muted);font-size:.82rem}
.stats b{display:block;color:var(--gold);font-family:var(--f-head);font-size:1.1rem;font-weight:500}

.filter{width:100%;margin:20px 0 4px;padding:12px 16px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit}
.filter::placeholder,.prow input::placeholder{color:var(--muted)}
.seclabel{display:flex;align-items:center;gap:10px;font-family:var(--f-head);color:var(--muted);font-size:.85rem;letter-spacing:.02em;margin:20px 0 8px}
.seclabel::after{content:"";flex:1;height:1px;background:var(--line)}
.marks{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gold);color:var(--ink);background:var(--gold-soft);border-radius:999px;padding:4px 14px;font-size:.9rem}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
.list{list-style:none;margin:0 0 30px;padding:0;display:grid;grid-template-columns:1fr;gap:0 24px}
@media (min-width:640px){.list{grid-template-columns:1fr 1fr}}
.list li{border-bottom:1px solid var(--line);min-width:0}
.srow{display:flex;align-items:center;gap:14px;width:100%;padding:12px 2px;background:none;border:0;text-align:right;border-radius:10px;transition:background .15s}
.srow:hover{background:var(--surface)}
.srow > span:nth-child(2){min-width:0}
.num{flex:none;width:42px;height:42px;display:grid;place-items:center;position:relative;font-family:var(--f-head);font-size:.92rem;color:var(--ink);font-variant-numeric:tabular-nums}
.num svg{position:absolute;inset:0;width:100%;height:100%}
.num svg path{fill:none;stroke:var(--gold);stroke-width:1.4}
.srow:hover .num svg path{fill:var(--gold-soft)}
.num b{position:relative;font-weight:500}
.sname{font-family:var(--f-quran);font-size:1.35rem;line-height:1.4}
.smeta{color:var(--muted);font-size:.8rem}
.srow .lat{margin-inline-start:auto;color:var(--muted);font-size:.78rem;direction:ltr;white-space:nowrap}

/* Reader */
.shead{text-align:center;padding-block:26px 6px}
.cartouche{display:inline-flex;align-items:center;gap:14px;padding:8px 26px;border-radius:999px;background:var(--solid);color:var(--solid-ink);font-family:var(--f-quran);font-size:1.7rem;line-height:1.5;box-shadow:0 0 0 1px var(--solid),0 0 0 4px var(--bg),0 0 0 5px var(--gold)}
.cartouche i{width:7px;height:7px;transform:rotate(45deg);background:var(--gold);flex:none}
.shead .smeta{margin-top:12px}
.basmala{font-family:var(--f-quran);font-size:1.65rem;text-align:center;margin:14px 0 4px;color:var(--ink)}
.tools{display:flex;justify-content:center;gap:6px;margin:10px 0 2px}
.verses{list-style:none;margin:0;padding:0 0 30px}
.verse{padding:18px 6px 12px;border-bottom:1px solid var(--line);scroll-margin-top:84px;transition:background .6s;border-radius:4px}
.verse.flash{background:var(--hl)}
.qtext{font-family:var(--f-quran);font-size:var(--qsize);line-height:2.3;margin:0;text-align:justify}
.ayn{font-family:var(--f-quran);color:var(--gold);white-space:nowrap;font-size:.95em}
.vbar{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;opacity:.82;transition:opacity .2s}
.verse:hover .vbar,.verse:focus-within .vbar{opacity:1}
.vb{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:none;border-radius:999px;padding:3px 11px;font-size:.84rem;color:var(--muted);text-decoration:none;transition:color .15s,border-color .15s,background .15s}
.vb:hover{color:var(--ink);border-color:var(--line-strong)}
.vb svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.vb[aria-expanded="true"]{color:var(--solid-ink);background:var(--solid);border-color:var(--solid)}
.vb.saved{color:var(--gold-strong);border-color:var(--gold);background:var(--gold-soft)}
.vb.saved svg{fill:currentColor}
.tools .vb{border-color:var(--line-strong);color:var(--ink);font-family:var(--f-head)}

.tafsir{margin-top:10px;border:1px solid var(--line-strong);border-radius:14px;background:var(--surface);overflow:hidden;border-top:2px solid var(--gold)}
.tabs{display:flex;gap:4px;padding:6px;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{flex:1;white-space:nowrap;border:0;background:none;padding:6px 12px;border-radius:999px;font-family:var(--f-head);font-size:.9rem;color:var(--muted)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--solid-ink);background:var(--solid)}
.tbody{padding:14px 16px;white-space:pre-line;font-size:1.03rem;line-height:2.05;max-height:60vh;overflow-y:auto}
.tbody .fn{color:var(--muted);font-size:.78em}
.tbody .q{font-family:var(--f-quran);color:var(--gold-strong)}
.note{color:var(--muted);font-size:.84rem;border-inline-start:2px solid var(--gold);padding:2px 10px;margin-bottom:10px;white-space:normal}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-block:18px 50px}
.pager button{border:1px solid var(--line-strong);background:var(--surface);border-radius:14px;padding:10px 14px;text-align:right;transition:border-color .15s}
.pager button:hover{border-color:var(--gold)}
.pager small{display:block;color:var(--muted);font-size:.78rem;font-family:var(--f-head)}
.pager b{font-family:var(--f-quran);font-weight:400;font-size:1.25rem}
.pager .next{grid-column:1}.pager .prev{grid-column:2;text-align:left}

/* Search panel */
.panel{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel .wrap{padding-block:12px}
.prow{display:flex;gap:8px;align-items:center}
.prow input{flex:1;min-width:0;padding:12px 16px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit}
.hint{color:var(--muted);font-size:.85rem;margin:10px 4px}
.res{list-style:none;padding:0;margin:0}
.res button{display:block;width:100%;text-align:right;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 4px}
.res button:hover{background:var(--surface)}
.res .ref{font-family:var(--f-head);font-size:.8rem;color:var(--gold-strong)}
.res .t{font-family:var(--f-quran);font-size:1.25rem;line-height:2}
.res mark{background:var(--gold-soft);color:inherit;border-bottom:1.5px solid var(--gold);padding:0 1px}
.loading{text-align:center;color:var(--muted);padding:50px 0;font-family:var(--f-head)}
.loading::before{content:"";display:block;width:26px;height:26px;margin:0 auto 12px;border:2px solid var(--line-strong);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.top{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);background:var(--solid);color:var(--solid-ink);display:grid;place-items:center}
.top svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.verse.stopped{background:linear-gradient(to left,var(--gold-soft),transparent 70%);border-inline-start:3px solid var(--gold);padding-inline-start:12px}
.stoptag{display:none;align-items:center;gap:6px;width:max-content;margin-bottom:4px;padding:1px 12px;border-radius:999px;background:var(--gold);color:#111;font-family:var(--f-head);font-size:.78rem}
.verse.stopped .stoptag{display:inline-flex}
.vb.here{color:#111;background:var(--gold);border-color:var(--gold)}
.vb.here svg{fill:currentColor}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:30;background:var(--solid);color:var(--solid-ink);border:1px solid var(--gold);padding:8px 18px;border-radius:999px;font-family:var(--f-head);font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.jump{display:flex;justify-content:center;margin-top:10px}
.jump .vb{border-color:var(--gold);color:var(--gold-strong);background:var(--gold-soft)}
.vbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;max-width:520px;flex-wrap:nowrap}
.vbar .vb{flex-direction:column;justify-content:center;gap:2px;padding:5px 2px;border-radius:10px;font-size:.72rem;line-height:1.3;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:center}
.vbar .vb svg{width:17px;height:17px}
.vb.playing{color:#111;background:var(--gold);border-color:var(--gold)}
.vb.playing svg{fill:currentColor}
.verse.reading{background:var(--rd)}
/* Mode toggle */
.modeseg{display:flex;gap:4px;padding:4px;margin:16px 0 0;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface)}
.modeseg button{flex:1;border:0;background:none;border-radius:999px;padding:7px 10px;font-family:var(--f-head);font-size:.92rem;color:var(--muted)}
.modeseg button[aria-pressed="true"]{background:var(--solid);color:var(--solid-ink)}
.juzbox summary{cursor:pointer;list-style:none;padding-block:6px;-webkit-tap-highlight-color:transparent}
.juzbox summary::-webkit-details-marker{display:none}
.juzbox summary::after{order:1}
.juzbox .chev{order:2;width:9px;height:9px;border-inline-start:1.8px solid var(--gold);border-bottom:1.8px solid var(--gold);transform:rotate(-45deg);transition:transform .2s;margin-inline-end:4px}
.juzbox[open] .chev{transform:rotate(135deg)}
.juzbox summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.juzbox .juzs{padding-bottom:4px}
.juzs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (min-width:640px){.juzs{grid-template-columns:repeat(10,minmax(0,1fr))}}
.juzs button{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:6px 0;font-family:var(--f-head);font-size:.95rem;font-variant-numeric:tabular-nums}
.juzs button:hover{border-color:var(--gold);color:var(--gold-strong)}

/* Page (mushaf) view: one printed page that fits the screen, text auto-sized to fill it */
html.pagemode,html.pagemode body{overflow:hidden;overscroll-behavior:none}
.pview{padding-block:8px 0;touch-action:pan-y}
.mpage{position:relative;margin:0 auto;background:var(--surface);border:1.5px solid var(--gold);border-radius:6px;padding:4px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(0,0,0,.35)}
.mpage::before,.mpage::after{content:"";position:absolute;width:9px;height:9px;background:var(--gold);transform:rotate(45deg);top:-5px;left:50%;margin-left:-4.5px}
.mpage::after{top:auto;bottom:-5px}
.mpage-in{height:100%;border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);border-radius:3px;padding:6px 12px 4px;display:flex;flex-direction:column}
.phead{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:4px;border-bottom:1px solid color-mix(in srgb,var(--gold) 40%,transparent);font-family:var(--f-head);font-size:.8rem;color:var(--muted)}
.phead .ps{font-family:var(--f-quran);font-size:1.05rem;color:var(--ink)}
.phead .pj{text-align:left}
.phead .pj b{color:var(--gold-strong);font-weight:500}
.pbody{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;font-size:20px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pinner{margin-block:auto;padding-block:2px}
.ptext{font-family:var(--f-quran);font-size:1em;line-height:2.02;text-align:justify;text-align-last:center;margin:0}
.pbody.isqpc{display:block;font-size:inherit}
.qpage{height:100%;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink);font-feature-settings:normal;--lh:2em}
.ql{height:var(--lh);display:flex;align-items:center;white-space:nowrap;line-height:1}
.qt{justify-content:space-between}.qt.short{justify-content:center;gap:.28em}
.qpage.opening{justify-content:center}.qpage.opening .qt.short{gap:.45em}
.qpage.measure .ql{display:block;width:max-content;height:auto}.qpage.measure .qt.short{gap:0}
.qw{padding:0 .02em;border-radius:3px;display:inline-block;line-height:1.55}
.qh{justify-content:center}.qh .cartouche{font-family:var(--f-quran);font-size:.82em;padding:.02em 1.1em;line-height:1.45;box-shadow:0 0 0 1px var(--solid),0 0 0 3px var(--surface),0 0 0 4px var(--gold)}
.qb{justify-content:center}.qbs{direction:ltr;unicode-bidi:isolate;font-family:qbsml,serif;font-size:1.05em;margin:0;line-height:1.3;padding:0 .4em;border-radius:6px}
.qw.stopped{box-shadow:inset 0 -2px 0 var(--gold);border-radius:0}
.pv{cursor:pointer;border-radius:4px;transition:background .45s;-webkit-tap-highlight-color:transparent}
.pv.pressing,.pv.sel,.pv.flash{background:var(--hl)}
.pv.reading{background:var(--rd)}
.pv.stopped{box-shadow:inset 0 -2px 0 var(--gold);border-radius:0}
.pv.stopped .ayn{color:var(--gold-strong)}
.basmala[data-bas]{cursor:pointer;border-radius:8px;transition:background .3s;-webkit-tap-highlight-color:transparent}
.basmala.reading{background:var(--rd)}
.pv:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.rub{color:var(--gold);font-size:.85em;margin-inline:2px}
.psura{text-align:center;margin:.25em 0 .1em}
.psura .cartouche{font-size:.82em;padding:.05em 1.1em;line-height:1.55;box-shadow:0 0 0 1px var(--solid),0 0 0 3px var(--surface),0 0 0 4px var(--gold)}
.psura .basmala{margin:.25em 0 0;font-size:.9em;line-height:1.9}
.pfoot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:4px;border-top:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
.pmid{display:flex;align-items:center;gap:8px}

.insttabs{align-self:center;margin-bottom:4px}

.instnudge>div{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.45}.instnudge b{font-size:.98rem}.instnudge span{font-size:.8rem;color:var(--muted)}
.instnudge .btn{flex:none;padding:8px 14px}
.instcard{display:flex;align-items:center;gap:12px;border-color:var(--gold)}.instcard>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.instcard span{font-size:.85rem;color:var(--muted)}

.instbox h3{margin:0;font-size:1.15rem}.instbox p{margin:0;color:var(--muted)}.instbox ol{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:8px;line-height:1.7}.instbox svg{vertical-align:-5px;color:var(--gold-strong)}
/* memorization v6 */
.hztabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:5px;border-radius:18px;background:var(--surface);border:1px solid var(--line-strong)}

.hztabs em{position:absolute;top:4px;inset-inline-start:7px;font-style:normal;font-size:.66rem;font-weight:700;color:var(--muted)}
.hztabs button[aria-selected="true"]{background:var(--solid);color:var(--solid-ink)}.hztabs button[aria-selected="true"] svg{stroke:var(--gold)}.hztabs button[aria-selected="true"] em{color:var(--gold)}
.hzgroup{display:flex;flex-direction:column;gap:12px}
.hzg-main{display:flex;align-items:baseline;justify-content:center;gap:10px}.hzg-main b{font-size:2rem;line-height:1;color:var(--gold-strong);font-variant-numeric:tabular-nums}
.hzg-main .lbl,.hzrow2 .lbl{font-weight:700;color:var(--ink)}
.hzg-ctl{display:flex;align-items:center;justify-content:center;gap:10px}
.hzg-ctl .ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.hzg-ctl .ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}.hzg-ctl .ib:disabled{opacity:.35}
.hzgroup .stepper{display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:999px;padding:4px;background:var(--bg)}
.hzgroup .stepper button{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);font-size:1.3rem;font-weight:700;cursor:pointer}.hzgroup .stepper button:disabled{opacity:.35}
.hzgroup .stepper span{min-width:76px;text-align:center;font-weight:600}.hzgroup .stepper b{color:var(--gold-strong)}
.hzprog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}.hzprog i{display:block;height:100%;background:var(--gold);border-radius:99px}
.hzgroup small{text-align:center}
.hzact{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.hzrow2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn.big{display:flex;align-items:center;justify-content:center;gap:10px;padding:15px 18px;font-size:1.08rem;font-weight:700;border-radius:16px}
.btn.big svg,.rvgo .btn svg{width:20px;height:20px;fill:currentColor;stroke:currentColor;stroke-width:1.5}
.rvgo .btn svg{fill:none;stroke-width:1.8}.rvgo .btn.gold svg{fill:currentColor}
.counter{text-align:center;color:var(--muted);min-height:1.4em}.counter b{color:var(--gold-strong)}
.hztext{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.hztext.pick .hzv{cursor:pointer;opacity:.42;filter:blur(2px);border-bottom-color:transparent;transition:opacity .35s,filter .35s}
.hztext.pick .hzv.ingrp{filter:none}
.hztext.pick.choosing .hzv{opacity:1;filter:none}.hztext.pick.choosing .hzv:not(.ingrp){border-bottom-color:var(--line)}
.hztext.pick.choosing .hzv:active{background:var(--hl)}
.pickbtn{display:flex;align-items:center;justify-content:center;gap:8px;align-self:center;padding:9px 18px;border-radius:999px;font-weight:600}
.pickbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover){.hztext.pick .hzv:not(.ingrp):hover{opacity:.6;filter:blur(1.5px)}}
.hztext.pick .hzv.ingrp{opacity:1;background:color-mix(in srgb,var(--gold) 9%,transparent);border-inline-start:3px solid var(--gold);border-radius:0}
.hztext.pick .hzv.first{border-start-start-radius:10px;border-start-end-radius:10px}.hztext.pick .hzv.lastg{border-end-start-radius:10px;border-end-end-radius:10px}
.hztext.pick .hzv.reading{opacity:1;background:var(--rd)}
.pickhint{display:flex;align-items:center;justify-content:center;gap:6px}.pickhint svg{width:14px;height:14px;fill:var(--gold);stroke:none}
.cntchips button{min-width:42px}
.hzv.cur{background:color-mix(in srgb,var(--gold) 10%,transparent)}
.nextstep,.result{display:flex;flex-direction:column;gap:10px;align-items:flex-start;border-width:1.5px}
.nextstep{border-color:var(--gold)}.nextstep b,.result b{font-size:1.1rem}.nextstep p,.result p{margin:0;color:var(--ink);line-height:1.7}
.result.ok{border-color:#2e7d4f;background:color-mix(in srgb,#2e7d4f 10%,var(--surface))}.result.ok b{color:#2e7d4f}
.result.ko{border-color:#b3261e;background:color-mix(in srgb,#b3261e 8%,var(--surface))}.result.ko b{color:#b3261e}
.rechow{margin:0 0 8px;line-height:1.7;color:var(--ink)}
.rectext{margin-top:6px}.rectext .hzv{border-bottom:0;padding:10px 6px}
.rectext .rw{--hwc:color-mix(in srgb,var(--ink) 9%,transparent);border-radius:8px}
.rw.hinted{color:var(--gold-strong);--hwc:transparent}
.recbar .btn.hint{flex:none;padding:10px 12px;background:transparent;color:var(--solid-ink);border-color:color-mix(in srgb,var(--solid-ink) 35%,transparent)}
.selfcheck{justify-content:center;margin-top:10px}
.rvcard{display:flex;flex-direction:column;gap:14px}
.rvopts{display:flex;flex-direction:column;gap:8px}
.rvopt{display:flex;align-items:center;gap:12px;text-align:right;padding:12px 14px;border-radius:14px;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.rvopt i{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line-strong)}
.rvopt span{display:flex;flex-direction:column;gap:2px;min-width:0}.rvopt b{font-size:1rem}.rvopt small{color:var(--muted);font-size:.84rem}
.rvopt[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 9%,var(--bg))}.rvopt[aria-pressed="true"] i{border-color:var(--gold);background:radial-gradient(circle,var(--gold) 0 45%,transparent 50%)}
.rvopt:disabled{opacity:.45;cursor:default}
.rvgo{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rvgo .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;font-weight:700}
.rvh{margin:14px 4px 4px;font-size:1.05rem}
.chainhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:14px 4px 6px}.chainhead b{font-size:1.15rem}
.ploop[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-strong)}
.mklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.mkrow{display:flex;align-items:stretch;gap:6px;border:1px solid var(--line-strong);border-radius:16px;background:var(--surface);overflow:hidden}
.mkgo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;text-align:right;padding:12px 14px;background:none;border:0;color:var(--ink);font:inherit;cursor:pointer}
.mkref{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.mkref b{font-size:1.05rem}.mkref small{color:var(--gold-strong)}
.mktxt{font-family:var(--f-quran);font-size:1.25rem;line-height:2;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mkdel{flex:none;width:44px;border:0;border-inline-start:1px solid var(--line);background:none;color:var(--muted);font-size:1.4rem;cursor:pointer}
.pplay svg{fill:currentColor;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
@keyframes inNext{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.mpage.in-next{animation:inNext .22s ease-out}.mpage.in-prev{animation:inPrev .22s ease-out}
html.pagemode .top{display:none}

/* Verse sheet */
.scrim{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.35)}
.sheet{position:fixed;inset:auto 0 var(--pl) 0;z-index:16;background:var(--surface);border-top:2px solid var(--gold);border-radius:18px 18px 0 0;max-height:78vh;overflow-y:auto;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet .wrap{padding-block:10px 0}
.sgrip{width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:0 auto 8px}
.shd{display:flex;align-items:center;gap:8px}
.shd .ref{flex:1;font-family:var(--f-head);color:var(--gold-strong);font-size:.9rem}
.sverse{font-family:var(--f-quran);font-size:1.35rem;line-height:2.1;margin:6px 0 8px;max-height:30vh;overflow-y:auto}
.sheet .vbar{grid-template-columns:repeat(5,minmax(0,1fr));opacity:1}
/* Mini player */
:root{--pl:0px}
.player{position:fixed;inset:auto 0 0 0;z-index:18;background:var(--solid);color:var(--solid-ink);border-top:1.5px solid var(--gold);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.player .wrap{display:flex;align-items:center;gap:8px;padding-block:8px}
.pbtn{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--solid-ink);display:grid;place-items:center}
.pbtn.main{background:var(--gold);color:#111;border-color:var(--gold)}
.pbtn svg{width:16px;height:16px;stroke:currentColor;fill:currentColor;stroke-width:1.8}
.pbtn.x svg{fill:none}
.pinfo{flex:1;min-width:0;line-height:1.3}
.pinfo b{display:block;font-family:var(--f-head);font-weight:500;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo small{color:var(--gold);font-size:.75rem}
.rsel{flex:none;max-width:46%;appearance:none;-webkit-appearance:none;background:transparent;color:var(--solid-ink);border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);border-radius:999px;padding:7px 12px 7px 30px;font:inherit;font-size:.85rem;
  background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:14px 50%,19px 50%;background-size:5px 5px;background-repeat:no-repeat}
.rsel option{color:#111;background:#fff}
.srec{display:flex;align-items:center;gap:10px;margin:10px 0 2px;padding:8px 12px;border:1px solid var(--line-strong);border-radius:12px;background:var(--bg)}
.srec select option{color:var(--ink);background:var(--surface)}
.srec select option:checked{color:var(--gold-strong)}
.srec span{font-family:var(--f-head);font-size:.85rem;color:var(--muted)}
.srec select{flex:1;min-width:0;appearance:none;-webkit-appearance:none;background:transparent;color:var(--ink);border:0;font:inherit;font-size:.95rem;padding:2px 22px 2px 0;
  background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:6px 55%,11px 55%;background-size:5px 5px;background-repeat:no-repeat}
.toast{bottom:calc(22px + var(--pl) + env(safe-area-inset-bottom,0px))!important}
.top{bottom:calc(18px + var(--pl) + env(safe-area-inset-bottom,0px))!important}
.src{color:var(--muted);font-size:.76rem;text-align:center;padding-block:10px 30px}
/* ===== v3: menu, pages, stats, hifz ===== */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
html.pagemode .mpage,html.pagemode .mpage *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;-webkit-user-drag:none}

/* More menu */
.menu{position:fixed;z-index:25;top:calc(env(safe-area-inset-top,0px) + 62px);left:max(16px,env(safe-area-inset-left,0px));min-width:220px;background:var(--surface);border:1px solid var(--line-strong);border-top:2px solid var(--gold);border-radius:14px;padding:6px;box-shadow:0 14px 40px -12px rgba(0,0,0,.35)}
.menu a,.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:none;border-radius:10px;color:var(--ink);text-decoration:none;font-family:var(--f-head);font-size:.95rem;text-align:right}
.menu a:hover,.menu button:hover{background:var(--bg)}
.menu svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.8;flex:none}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.menu .sw{margin-inline-start:auto}
.sw{position:relative;width:38px;height:22px;border-radius:999px;background:var(--line-strong);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .2s}
[aria-checked="true"] .sw,.sw.on{background:var(--gold)}
[aria-checked="true"] .sw::after,.sw.on::after{transform:translateX(-16px)}

/* Secondary pages */
.pgx{padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
.pgx-h{display:flex;align-items:center;gap:10px}
.pgx-h h1{flex:1;margin:0;font-family:var(--f-head);font-weight:700;font-size:1.45rem;text-wrap:balance}
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 12px;font-family:var(--f-head);font-size:.85rem;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink);border-color:var(--gold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.card h2{margin:0 0 10px;font-family:var(--f-head);font-weight:500;font-size:1rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:7px;height:7px;background:var(--gold);transform:rotate(45deg);flex:none}
.note2{color:var(--muted);font-size:.9rem;line-height:1.9;margin:0}
.seg{display:flex;gap:4px;padding:4px;border:1px solid var(--line-strong);border-radius:999px;background:var(--bg)}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:6px 8px;font-family:var(--f-head);font-size:.88rem;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--solid);color:var(--solid-ink)}
.row{display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row > span{flex:1;min-width:0}
.row small{display:block;color:var(--muted);font-size:.8rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;font-family:var(--f-head);font-size:.9rem}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#111}
.btn.solid{background:var(--solid);border-color:var(--solid);color:var(--solid-ink)}
.btn.danger{color:#b3261e;border-color:color-mix(in srgb,#b3261e 50%,transparent)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.swbtn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:0;text-align:right;color:var(--ink)}
.swbtn > span{flex:1}

/* Home extras */
.resume{display:flex;align-items:center;gap:10px;margin:10px auto 0;max-width:420px;width:100%;padding:9px 16px;border-radius:12px;background:transparent;color:var(--cover-ink);border:1px solid var(--gold);text-align:right}
.resume svg{width:18px;height:18px;fill:var(--gold);flex:none}
.resume b{font-family:var(--f-head);font-weight:500;font-size:.92rem;display:block}
.resume span{font-size:.8rem;color:var(--cover-muted)}
.ordbtn{order:2;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:3px 10px;font-family:var(--f-head);font-size:.78rem;color:var(--ink)}
.ordbtn svg{width:14px;height:14px;stroke:var(--gold);fill:none;stroke-width:2}

/* Stats */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tile small{display:block;color:var(--muted);font-family:var(--f-head);font-size:.78rem}
.tile b{display:block;font-family:var(--f-head);font-weight:500;font-size:1.45rem;line-height:1.5;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile em{font-style:normal;color:var(--muted);font-size:.75rem}
.tile.hero{grid-column:1/-1;background:var(--solid);color:var(--solid-ink);border-color:var(--solid);position:relative;overflow:hidden}
.tile.hero small{color:color-mix(in srgb,var(--solid-ink) 70%,transparent)}
.tile.hero b{color:var(--gold);font-size:1.9rem}
.tile.hero em{color:color-mix(in srgb,var(--solid-ink) 70%,transparent)}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.adform{display:flex;gap:10px}.adform input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.adgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.adk{display:flex;flex-direction:column;gap:2px}.adk b{font-size:1.7rem;color:var(--gold-strong);font-variant-numeric:tabular-nums}.adk span{font-size:.85rem;color:var(--muted)}
.adbars{display:flex;align-items:flex-end;gap:3px;height:140px;direction:ltr}.adb{flex:1;height:100%;display:flex;align-items:flex-end}.adb i{display:block;width:100%;background:var(--gold);border-radius:3px 3px 0 0;opacity:.85}
.adb{position:relative;flex-direction:column;justify-content:flex-end}.adb i{position:relative;overflow:hidden}.adb i s{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--gold) 45%,var(--surface));text-decoration:none}
.adb em{font-style:normal;font-size:.72rem;color:var(--muted);text-align:center;margin-top:3px;order:2}
.adk small{font-size:.75rem;color:var(--muted)}
.adleg{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:.8rem;color:var(--muted)}.adleg i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--gold);margin-inline-end:5px;vertical-align:-1px}.adleg i.r{background:color-mix(in srgb,var(--gold) 45%,var(--surface))}
.adax span{flex:1;text-align:center}
.adax{display:flex;gap:3px;justify-content:space-between;direction:ltr;font-size:.75rem;color:var(--muted);margin-top:6px}
.chart .bar{fill:color-mix(in srgb,var(--gold) 55%,transparent)}
.chart .bar.now{fill:var(--gold)}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-head)}
.chart .val{fill:var(--gold-strong);font-size:11px}
.khat{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.khat i{display:block;height:100%;background:var(--gold);border-radius:999px}
.hadith{font-family:var(--f-quran);font-size:1.15rem;line-height:2;margin:0 0 6px;color:var(--ink)}

/* Hifz */
.ringbox{display:flex;align-items:center;gap:16px}
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--gold);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{fill:var(--ink);font-family:var(--f-head);font-size:15px}
.pill{flex:none;border-radius:999px;padding:2px 10px;font-family:var(--f-head);font-size:.75rem;border:1px solid var(--line-strong);color:var(--muted)}
.pill.mem{background:var(--gold);border-color:var(--gold);color:#111}
.pill.learn{border-color:var(--gold);color:var(--gold-strong)}
.pill.due{background:var(--solid);border-color:var(--solid);color:var(--solid-ink)}
.hzlist{list-style:none;margin:0;padding:0}
.hzlist li{border-bottom:1px solid var(--line)}
.hzlist li:last-child{border-bottom:0}
.hzrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 2px;background:none;border:0;text-align:right;color:var(--ink);text-decoration:none}
.hzrow .sname{font-size:1.2rem}
.hzrow .meta{flex:1;min-width:0}
.range{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-head);font-size:.9rem;color:var(--muted)}
.range input{width:64px;padding:6px 8px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;text-align:center;font-variant-numeric:tabular-nums}
.hzv{font-family:var(--f-quran);font-size:var(--qsize);line-height:2.3;margin:0;padding:8px 6px;border-bottom:1px solid var(--line);border-radius:6px;text-align:justify;transition:background .4s}
.hzv.reading{background:var(--rd)}
.hw{--hwc:color-mix(in srgb,var(--gold) 22%,var(--line));cursor:pointer;color:transparent;background:linear-gradient(var(--hwc),var(--hwc)) 50% 58%/100% .95em no-repeat;border-radius:4px;transition:color .25s;-webkit-tap-highlight-color:transparent}
.hw.shown{color:inherit;--hwc:transparent;cursor:default}
.hw.shown.just{--hwc:var(--gold-soft)}
.hzctl{position:sticky;bottom:calc(10px + var(--pl) + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:8px;padding:8px;margin-top:6px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line-strong);border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:3}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 14px;font-family:var(--f-head);font-size:.85rem;color:var(--muted)}
.chips button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-strong);background:var(--gold-soft)}
.counter{text-align:center;font-family:var(--f-head);color:var(--gold-strong);min-height:1.6em}
.quizq{font-family:var(--f-quran);font-size:1.45rem;line-height:2.1;margin:0;text-align:center}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line-strong);background:var(--surface);border-radius:14px;padding:10px 14px;font-family:var(--f-quran);font-size:1.25rem;line-height:1.9;text-align:right;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt.ok{border-color:var(--gold);background:var(--gold-soft)}
.opt.no{border-color:#b3261e;opacity:.75}
.opt:disabled{cursor:default}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line-strong)}
.dots i.ok{background:var(--gold)}
.dots i.no{background:#b3261e}
.dots i.cur{outline:2px solid var(--gold);outline-offset:2px}
#hzTab button{padding-inline:4px;font-size:.82rem}
.rw{--hwc:color-mix(in srgb,var(--gold) 22%,var(--line));color:transparent;background:linear-gradient(var(--hwc),var(--hwc)) 50% 58%/100% .95em no-repeat;border-radius:4px;transition:color .3s}
.rw.peek{color:color-mix(in srgb,var(--ink) 45%,transparent);--hwc:transparent}
.rw.ok{color:inherit;--hwc:transparent}
.rw.miss{color:#b3261e;--hwc:transparent;text-decoration:underline wavy color-mix(in srgb,#b3261e 60%,transparent);text-underline-offset:.35em}
#recText .hzv{cursor:pointer;border-inline-start:3px solid transparent;transition:background .3s,border-color .3s}
#recText .hzv.cur{border-inline-start-color:var(--gold);background:color-mix(in srgb,var(--gold-soft) 60%,transparent)}
.heard{min-height:1.4em;text-align:center;color:var(--muted);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.mic{padding:12px 22px;font-size:1rem}
.btn.mic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.btn.mic.live{background:var(--solid);border-color:var(--solid);color:var(--solid-ink);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 55%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
.big{font-family:var(--f-head);font-size:1.6rem;text-align:center;margin:4px 0;color:var(--gold-strong)}

/* ===== v4: reorganised secondary pages ===== */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ring .rs{font-size:10px;fill:var(--muted)}
.lead{font-family:var(--f-head);font-size:1.1rem;font-weight:700}
.todaycard{display:flex;flex-direction:column;gap:14px}
.todaytxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.todaytxt b{font-family:var(--f-head);font-size:1.15rem}
.stepper{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-strong);border-radius:999px;padding:3px;align-self:flex-start;background:var(--bg)}
.stepper button{width:32px;height:32px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);font-size:1.1rem;line-height:1;font-family:var(--f-head)}
.stepper button:hover{color:var(--gold-strong)}
.stepper span{min-width:6ch;text-align:center;font-family:var(--f-head);font-size:.88rem;font-variant-numeric:tabular-nums}
.mini3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);padding-top:10px}
.mini3 div{text-align:center;min-width:0}
.mini3 div+div{border-inline-start:1px solid var(--line)}
.mini3 b{display:block;font-family:var(--f-head);font-weight:500;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini3 small{color:var(--muted);font-size:.75rem}
.chead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.seg.sm button{padding:4px 10px;font-size:.8rem}
.chart .goal{stroke:var(--gold-strong);stroke-width:1.2;stroke-dasharray:4 4}
.chart .bar.met{fill:var(--gold)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit.sel{fill:color-mix(in srgb,var(--gold) 12%,transparent)}
.chtip{margin:4px 0 0;text-align:center;color:var(--muted);font-size:.82rem;min-height:1.5em}
.khead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-family:var(--f-head)}
.khead span{color:var(--gold-strong)}
.fold summary{cursor:pointer;font-family:var(--f-head);color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"";margin-inline-start:auto;width:8px;height:8px;border-inline-start:1.6px solid var(--gold);border-bottom:1.6px solid var(--gold);transform:rotate(-45deg);transition:transform .2s}
.fold[open] summary::after{transform:rotate(135deg)}
.fold[open] summary{margin-bottom:10px}
.h2x{margin:4px 2px -8px;font-family:var(--f-head);font-weight:500;font-size:.88rem;color:var(--muted)}
.card.tight{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.duecard{border-color:var(--gold)}
.duecard h2 .pill{margin-inline-start:4px}
.okline{text-align:center;margin:-4px 0}
.btn.sm{padding:4px 12px;font-size:.82rem}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scroll-snap-type:x mandatory}
.lcard{flex:none;scroll-snap-align:start;display:flex;flex-direction:column;gap:2px;min-width:120px;padding:10px 14px;border:1px solid var(--gold);border-radius:14px;background:var(--gold-soft);color:var(--ink);text-decoration:none}
.lcard .sname{font-size:1.2rem}
.lcard small{color:var(--muted);font-size:.75rem}
.chips button:disabled{opacity:.4;cursor:default}
.hzhead{display:flex;align-items:center;gap:12px}
.hzname{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column}
.hzname .sname{font-size:1.45rem;line-height:1.4}
.hzname small{color:var(--muted);font-size:.78rem}
.tooltabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tooltabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border:1px solid var(--line-strong);background:var(--surface);border-radius:14px;color:var(--muted);font-family:var(--f-head);font-size:.82rem}
.tooltabs svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
.tooltabs button[aria-pressed="true"]{background:var(--solid);border-color:var(--solid);color:var(--solid-ink)}
.tooltabs button[aria-pressed="true"] svg{stroke:var(--gold)}
.preview{font-family:var(--f-quran);font-size:var(--qsize);line-height:2;margin:0;padding:4px 0 8px;text-align:center;border-bottom:1px solid var(--line)}

/* ===== v5: current surah, memorized list, pickers ===== */
.chead2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.chead2 h2{margin:0}
.curcard{display:flex;flex-direction:column;gap:10px;border-color:var(--gold)}
.curcard.empty h2{margin:0}
.currow{display:flex;flex-direction:column;color:var(--ink);text-decoration:none}
.currow .sname{font-size:1.6rem;line-height:1.5}
.currow small{color:var(--muted);font-family:var(--f-head);font-size:.85rem}
.btn.wide{width:100%;padding:11px 16px;font-size:.98rem}
.hzlist li{display:flex;align-items:center;gap:6px}
.hzlist li .hzrow{flex:1;min-width:0}
.xbtn{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);font-size:1.15rem;line-height:1}
.xbtn:hover{color:#b3261e;border-color:color-mix(in srgb,#b3261e 50%,transparent)}
.rmask{flex:1;display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 2px;font-family:var(--f-head);font-size:.9rem}
.rmask span{flex:1;min-width:150px}
.picker{max-height:86vh;display:flex;flex-direction:column}
.picker .wrap{display:flex;flex-direction:column;min-height:0;flex:1}
.pklist{list-style:none;margin:6px 0 0;padding:0;overflow-y:auto;flex:1;min-height:120px}
.pkrow{display:flex;align-items:center;gap:12px;width:100%;padding:9px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:right;color:var(--ink)}
.pkrow .meta{flex:1;min-width:0}
.pkrow .sname{font-size:1.2rem;display:block;line-height:1.5}
.pkrow small{color:var(--muted);font-size:.75rem}
.ck{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;transition:background .15s,border-color .15s}
.pkrow.on .ck{background:var(--gold);border-color:var(--gold)}
.pkrow.on .ck::after{content:"";width:9px;height:5px;border-left:2px solid #111;border-bottom:2px solid #111;transform:rotate(-45deg) translateY(-1px)}
.pkfoot{padding-top:10px}
.pkbar{display:flex;align-items:center;gap:8px}
.pkbar .filter{flex:1;min-width:0;margin:0}
.chead2 .btns{align-items:center;gap:6px}
.atrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border-radius:12px;background:var(--gold-soft);font-family:var(--f-head);font-size:.88rem}
.atrow svg{width:16px;height:16px;fill:var(--gold);stroke:none;flex:none}
.atrow input{width:64px;padding:5px 8px;border-radius:10px;border:1px solid var(--gold);background:var(--surface);color:var(--ink);font:inherit;text-align:center}
.atrow .btn{margin-inline-start:auto}

/* ===== v6: recitation layout ===== */
.recinfo{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.recbar{position:sticky;bottom:calc(10px + var(--pl) + env(safe-area-inset-bottom,0px));z-index:4;display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 8px 8px 14px;border-radius:999px;background:var(--solid);color:var(--solid-ink);border:1px solid var(--gold);box-shadow:0 10px 30px -12px rgba(0,0,0,.4)}
.recstat{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.recstat b{font-family:var(--f-head);font-weight:500;color:var(--gold);font-size:.95rem}
.recbar .heard{text-align:right;color:color-mix(in srgb,var(--solid-ink) 70%,transparent);font-size:.82rem;min-height:1.2em}
.recbar .btn.mic{flex:none;padding:10px 18px}
.recbar .btn.mic.live{background:var(--gold);border-color:var(--gold);color:#111}
#recText .hzv{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 70px);transition:background .3s,border-color .3s,opacity .4s,font-size .4s}
#recText .hzv.done{opacity:.62;font-size:calc(var(--qsize)*.72)}
body.reclive .recinfo,body.reclive .hzpage>*:not(#hzBody):not(.hzhead){display:none}

/* ===== v7: recitation panel, level meter ===== */
.recopts{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.recopts .swbtn{width:auto;gap:8px;font-family:var(--f-head);font-size:.9rem}
.lvl{flex:none;width:10px;height:28px;border-radius:5px;background:color-mix(in srgb,var(--gold) 25%,transparent);position:relative;overflow:hidden}
.lvl::after{content:"";position:absolute;inset:auto 0 0 0;height:calc(var(--lv,0)*100%);background:var(--gold);transition:height .08s}
.recbar .heard{color:var(--solid-ink);opacity:.85;font-size:.92rem;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.recbar .heard.live{opacity:.65}

/* ===== v8: no sideways drift on iPhone ===== */
/* iOS zooms into any field whose text is under 16px, and the page then slides left and right */
input,select,textarea{font-size:16px!important}
html,body{max-width:100%;overflow-x:hidden;overflow-x:clip}

/* ===== v9: gap between verses ===== */
.pgap{flex:none;display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 10px;border-radius:999px;border:1px solid var(--gold);background:none;color:var(--solid-ink);font-family:var(--f-head);font-size:.8rem;white-space:nowrap}
.pgap svg{width:15px;height:15px;stroke:var(--gold);fill:none;stroke-width:1.8}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

/* ---------- Search ---------- */
function norm(s){return s.replace(/[ؐ-ًؚ-ٰٟۖ-ۭ࣓-ࣿـ]/g,"")
  .replace(/[إأآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/\s+/g," ").trim()}
let QURAN=null,QN=null;
const DIAC=/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u08D3-\u08FF\u0640]/;
function highlight(orig,nq){
  let n="",map=[];
  for(let i=0;i<orig.length;i++){const c=orig[i];if(DIAC.test(c))continue;n+=norm(c)||c;map.push(i)}
  const at=n.indexOf(nq);if(at<0)return esc(orig);
  const st=map[at];let en=map[at+nq.length-1]+1;while(en<orig.length&&DIAC.test(orig[en]))en++;
  return esc(orig.slice(0,st))+"<mark>"+esc(orig.slice(st,en))+"</mark>"+esc(orig.slice(en));
}
async function ensureIndex(){if(QURAN)return;const r=await fetch("quran.json");QURAN=await r.json();QN=QURAN.map(s=>s.map(norm))}
const toLatin=s=>s.replace(/[٠-٩]/g,d=>AR.indexOf(d));
async function runSearch(q){
  const res=$("#res"),hint=$("#hint");q=q.trim();
  if(!q){res.innerHTML="";hint.textContent="اكتب كلمة دون تشكيل، مثل: الصبر، أو رقم السورة والآية مثل 2:255.";return}
  const ref=toLatin(q).match(/^(\d{1,3})\s*[:：.\/\-]\s*(\d{1,3})$/);
  if(ref){const s=+ref[1],v=+ref[2];if(s>=1&&s<=114&&v>=1&&v<=META[s-1][4]){hint.textContent="انتقال مباشر:";
      res.innerHTML=`<li><button type="button" data-go="${s}-${v}"><div class="ref">سورة ${META[s-1][1]}، الآية ${an(v)}</div><div class="t">اضغط للانتقال إلى الآية</div></button></li>`}
    else{res.innerHTML="";hint.textContent=`هذا الرقم غير موجود. السور من ${an(1)} إلى ${an(114)}.`}return}
  if(norm(q).length<2){res.innerHTML="";hint.textContent="اكتب حرفين على الأقل.";return}
  hint.textContent="جارٍ البحث…";
  try{await ensureIndex()}catch(e){hint.textContent="تعذّر تحميل فهرس البحث.";return}
  const nq=norm(q),out=[];let total=0;
  for(let s=0;s<114;s++)for(let v=0;v<QN[s].length;v++)if(QN[s][v].includes(nq)){total++;if(out.length<60)out.push([s+1,v+1])}
  hint.textContent=total?`${an(total)} نتيجة${total>60?` (تُعرض أول ${an(60)})`:""}`:"لا توجد نتائج. جرّب كلمة أقصر أو بدون "+"ال"+".";
  res.innerHTML=out.map(([s,v])=>`<li><button type="button" data-go="${s}-${v}"><div class="ref">${META[s-1][1]}، ${an(v)}</div><div class="t">${highlight(QURAN[s-1][v-1],nq)}</div></button></li>`).join("");
}

/* ---------- Page-turn sound (synthesised paper) ---------- */
let actx=null;
function pageSound(){
  if(!store.get("pagesound",true)||(player.s&&!audioPaused()))return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();
    const sr=actx.sampleRate,dur=.38,n=Math.floor(sr*dur),buf=actx.createBuffer(1,n,sr),d=buf.getChannelData(0);
    let lp=0;for(let i=0;i<n;i++){const t=i/n;const env=Math.pow(Math.sin(Math.PI*t),1.4)*(t<.35?1:.75);const crk=Math.random()<.015?2.4:1;
      lp=lp*.4+(Math.random()*2-1)*.6;d[i]=lp*env*crk}
    const now=actx.currentTime,src=actx.createBufferSource();src.buffer=buf;
    const bp=actx.createBiquadFilter();bp.type="bandpass";bp.Q.value=.8;bp.frequency.setValueAtTime(900,now);bp.frequency.exponentialRampToValueAtTime(3600,now+dur*.75);
    const hp=actx.createBiquadFilter();hp.type="highpass";hp.frequency.value=450;
    const g=actx.createGain();g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.32,now+.04);g.gain.exponentialRampToValueAtTime(.0001,now+dur);
    src.connect(bp);bp.connect(hp);hp.connect(g);g.connect(actx.destination);src.start(now);src.stop(now+dur+.02);
    clearTimeout(pageSound.t);pageSound.t=setTimeout(()=>{try{actx.close()}catch(e){}actx=null},1500);
  }catch(e){}
}

  return ST.days[d]||(ST.days[d]={r:0,l:0,h:0,sec:0})}

function lastDays(n){const out=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);out.push({k:ymd(d),day:d.getDate()})}return out}
function streak(){let c=0;const d=new Date();const ok=k=>{const x=ST.days[k];return x&&(x.r>0||x.sec>=120)};
  if(!ok(ymd(d)))d.setDate(d.getDate()-1);while(ok(ymd(d))){c++;d.setDate(d.getDate()-1)}return c}
/* ---------- Memorization (hifz) ---------- */
let HZ=store.get("hifz",null)||{};
const BOX=[1,3,7,14,30,60];
function hzSave(){save("hifz",HZ)}
function setHzStatus(s,st){if(st===1)return setCurrent(s);if(!st){delete HZ[s]}else{HZ[s]={st:2,box:0,due:addDays(BOX[0])}}hzSave();return 0}
function hzReview(s,ok){const h=HZ[s];if(!h)return;const box=ok?Math.min(BOX.length-1,(h.box||0)+1):0;HZ[s]={st:2,box,due:addDays(BOX[box])};hzSave()}
const hzDue=()=>Object.keys(HZ).map(Number).filter(s=>HZ[s].st===2&&HZ[s].due<=today()).sort((a,b)=>a-b);
function daysUntil(k){return Math.round((new Date(k+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5)}
function hzPill(s){const h=HZ[s];if(!h)return "";if(h.st===2)return h.due<=today()?'<span class="pill due">للمراجعة</span>':'<span class="pill mem">محفوظة</span>';return '<span class="pill learn">قيد الحفظ</span>'}
const STARP='<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2l5.3 5.9 7.4.8.8 7.4L39.4 20l-5.9 5.3-.8 7.4-7.4.8L20 39.4l-5.3-5.9-7.4-.8-.8-7.4L.6 20l5.9-5.3.8-7.4 7.4-.8z"/></svg>';
function hzRow(s){const m=META[s-1];return `<li><a class="hzrow" href="#hifz-${s}"><span class="num">${STARP}<b>${an(s)}</b></span><span class="meta"><span class="sname">سورة ${m[1]}</span><br><span class="smeta">${an(m[4])} آية</span></span>${hzPill(s)}</a></li>`}
/* ---------- Memorization of one surah, in three steps: listen (loop) → recite (the app checks) → review ---------- */
let hzS=0;
const isMark=w=>!/[ء-يٱ-ۓ]/.test(w);
const hzCnt=()=>{const c=store.get("hzcnt",3)|0;return [1,3,5,7,10].includes(c)?c:3};
const hzReps=()=>{const r=store.get("hzreps2",3);return [3,5,7,10].includes(r)?r:3};
const hzLearned=(n,N)=>{const h=HZ[n];if(!h)return Math.max(0,Math.min(N,store.get("hzat"+n,1)-1));if(h.st===2)return N;return Math.max(0,Math.min(N,(h.at||1)-1))};
/* the verses being learned: from the saved position (or the group the reader moved to), «count» verses */
function hzGroup(n,N){const g=store.get("hzg"+n,0),a=Math.max(1,Math.min(N,g||hzLearned(n,N)+1));return [a,Math.min(N,a+hzCnt()-1)]}
const hzVerses=(n,data,a,b,cls)=>{let h="";for(let v=a;v<=b;v++)h+=`<p class="hzv${cls?" "+cls:""}" data-sv="${n}:${v}">${esc(data.v[v-1])} <span class="ayn">﴿${an(v)}﴾</span></p>`;return h};
const follow=(s,v)=>{const el=document.querySelector(`.hzv[data-sv="${s}:${v}"]`);if(el){const q=el.getBoundingClientRect();if(q.top<90||q.bottom>innerHeight-150)el.scrollIntoView({block:"center",behavior:"smooth"})}};
function repChips(id,val,opts){return `<div class="chips" id="${id}">${opts.map(r=>`<button type="button" data-r="${r}" aria-pressed="${val===r}">${an(r)}×</button>`).join("")}</div>`}
const noAudio=`<div class="card"><p class="note2">الاستماع يعمل في نسخة التطبيق على mushaf-tadabbur.vercel.app.</p></div>`;

/* step 1 — listen to the group in a loop */
function drawListen(n,data){
  const N=data.v.length,[a,b]=hzGroup(n,N),reps=hzReps(),body=$("#hzBody");
  body.innerHTML=`${hzGroupCard(n,N,a,b)}
    ${STANDALONE?`<section class="card hzact">
      <div class="hzrow2"><span class="lbl">عدد مرات الاستماع</span>${repChips("hzReps",reps,[3,5,7,10])}</div>
      <button class="btn gold big" type="button" id="hzPlay">${ICON.play}<span>استمع ${an(reps)} مرات</span></button>
      <div class="counter" id="hzCount" aria-live="polite"></div>
    </section>`:noAudio}
    <div id="hzAfter"></div><h3 class="rvh">سورة ${META[n-1][1]}</h3><div class="hztext pick" id="hzAll">${hzVerses(n,data,1,N)}</div>`;
  bindGroup(n,data,drawListen);
  /* the chosen verses stand out in the full text; tapping a verse starts the group there */
  const all=$("#hzAll");all.querySelectorAll(".hzv").forEach(p=>{const v=+p.dataset.sv.split(":")[1];p.classList.toggle("ingrp",v>=a&&v<=b);p.classList.toggle("first",v===a);p.classList.toggle("lastg",v===b)});
  /* «change the start»: every verse becomes clear, tap the first one, the focus comes back */
  const pickOn=on=>{all.classList.toggle("choosing",on);document.body.classList.toggle("hzpicking",on);
    if(on){const f=all.querySelector(".hzv.first");if(f)f.scrollIntoView({block:"center",behavior:"smooth"});toast("اضغط على الآية التي تبدأ منها")}};
  $("#hzPick").onclick=()=>pickOn(!all.classList.contains("choosing"));
  all.onclick=e=>{const p=e.target.closest(".hzv");if(!p)return;if(!all.classList.contains("choosing")){pickOn(true);return}
    const v=+p.dataset.sv.split(":")[1];store.set("hzg"+n,v);document.body.classList.remove("hzpicking");if(player.queue)stopAudio();drawListen(n,data);
    const el=document.querySelector(`#hzAll .hzv[data-sv="${n}:${v}"]`);if(el)el.scrollIntoView({block:"center"});toast(`تبدأ من الآية ${an(v)}`)};if(!STANDALONE)return;
  $("#hzReps").onclick=e=>{const x=e.target.closest("[data-r]");if(x){store.set("hzreps2",+x.dataset.r);if(player.queue)stopAudio();drawListen(n,data)}};
  const btn=$("#hzPlay"),label=t=>{btn.querySelector("span").textContent=t};
  btn.onclick=()=>{
    const items=[];for(let r=1;r<=reps;r++)for(let v=a;v<=b;v++)items.push([n,v,r]);
    $("#hzAfter").innerHTML="";
    playQueue(items,(s,v,r)=>{const c=$("#hzCount");if(c)c.innerHTML=`المرة <b>${an(r)}</b> من ${an(reps)} · الآية ${an(v)}`;follow(s,v)},
      ()=>{if(!$("#hzPlay"))return;label("استمع مرة أخرى");$("#hzCount").textContent="";
        $("#hzAfter").innerHTML=`<section class="card nextstep"><b>انتهى الاستماع</b><p>هل أنت جاهز لتسميع الآيات من حفظك؟</p><button class="btn gold" type="button" id="toRecite">انتقل إلى التسميع ←</button></section>`;
        $("#toRecite").onclick=()=>hzSwitch("recite");$("#hzAfter").scrollIntoView({block:"center",behavior:"smooth"})});
    label(`أعد من البداية`);
  };
}
/* the group card shared by listen and recite: which verses, how many, previous / next group */
function hzGroupCard(n,N,a,b){const L=hzLearned(n,N),cnt=hzCnt();
  return `<section class="card hzgroup">
    <div class="hzg-main"><span class="lbl">الآيات</span><b>${a===b?an(a):`${an(a)} – ${an(b)}`}</b><span class="muted">من ${an(N)}</span></div>
    <div class="hzg-ctl">
      <div class="chips cntchips" role="group" aria-label="عدد الآيات">${[1,3,5,7,10].map(c=>`<button type="button" data-n="${c}" aria-pressed="${cnt===c}">${an(c)}</button>`).join("")}</div>
    </div>
    <button class="btn pickbtn" type="button" id="hzPick"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>تغيير البداية</span></button>
    ${HZ[n]&&HZ[n].st===1?`<div class="hzprog"><i style="width:${Math.round(L/N*100)}%"></i></div><small class="muted">حفظتَ ${an(L)} من ${an(N)} آية</small>`:""}
  </section>`}
function bindGroup(n,data,redraw){const N=data.v.length,c=$(".hzgroup");if(!c)return;
  c.onclick=e=>{const x=e.target.closest("button");if(!x||x.disabled||!(x.dataset.n||x.dataset.g))return;const [a,b]=hzGroup(n,N),cnt=hzCnt();
    if(x.dataset.n){store.set("hzcnt",+x.dataset.n)}
    else if(x.dataset.g==="next")store.set("hzg"+n,Math.min(N,b+1));
    else if(x.dataset.g==="prev")store.set("hzg"+n,Math.max(1,a-cnt));
    if(player.queue)stopAudio();stopRec();rec=null;redraw(n,data)}}

/* step 2 — recite the group from memory; passing saves the position and moves to the next verses */
function drawRecite(n,data){
  const N=data.v.length,[a,b]=hzGroup(n,N),body=$("#hzBody");
  body.innerHTML=`<div id="rcBox"></div>`;
  reciteView($("#rcBox"),n,data,a,b,{
    onPass:()=>{const h=HZ[n];let msg="";
      if(!h||h.st!==2){if(!h||h.st!==1){setCurrent(n)}
        const H=HZ[n];if(H&&H.st===1){
          if(b>=N){HZ[n]={st:2,box:0,due:addDays(BOX[0])};hzSave();store.set("hzg"+n,0);return {msg:`ما شاء الله، أتممت حفظ سورة ${META[n-1][1]}`,next:null}}
          H.at=Math.max(H.at||1,b+1);hzSave();msg=`حُفظ موضعك: الآية ${an(b+1)}`}}
      if(b>=N)return {msg:msg||"أتممت آخر السورة",next:null};
      store.set("hzg"+n,b+1);const nb=Math.min(N,b+hzCnt());
      return {msg,next:{label:`الآيات التالية (${an(b+1)}${nb>b+1?` – ${an(nb)}`:""}) ←`,go:()=>hzSwitch("listen")}}},
    onRetry:()=>hzSwitch("listen")});
}
/* the reciting box: hidden text, microphone, hint, result. Tolerant by default (strict in the settings). */
function reciteView(box,n,data,a,b,cb){
  stopRec();
  if(!STANDALONE){box.innerHTML=`<div class="card"><p class="note2">التسميع بالميكروفون يعمل في نسخة التطبيق على mushaf-tadabbur.vercel.app.</p></div>`;return}
  const show=false,strict=store.get("strict",false);
  const words=[];let html="";
  for(let v=a;v<=b;v++){const ws=data.v[v-1].split(" ");
    html+=`<p class="hzv" data-sv="${n}:${v}">`+ws.map(w=>{if(isMark(w))return esc(w);const k=words.length;words.push(skel(w));return `<span class="rw${show?" peek":""}" data-k="${k}">${esc(w)}</span>`}).join(" ")+` <span class="ayn">﴿${an(v)}﴾</span></p>`}
  box.innerHTML=`${SRC?"":`<p class="note2">المتصفح لا يدعم التعرّف على الصوت: اقرأ من حفظك ثم اكشف النص لتتحقق.</p>`}
    <div id="recText" class="rectext">${html}</div><div id="recRes"></div>
    <div class="recbar"><i class="lvl" id="recLvl" aria-hidden="true"></i><div class="recstat"><b id="recStat">${an(0)} / ${an(words.length)}</b><span class="heard" id="recHeard" aria-live="polite"></span></div>
      <button class="btn hint" type="button" id="recHint" title="أظهر الكلمة التالية">تلميح</button>
      <button class="btn gold mic" type="button" id="recBtn">${SRC?`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>ابدأ</span>`:"<span>اكشف النص</span>"}</button></div>`;
  const spans=[...box.querySelectorAll(".rw")],vEls=[...box.querySelectorAll(".hzv")];
  const vStart={},vEnd={},vOf=[];spans.forEach((sp,k)=>{const v=+sp.closest(".hzv").dataset.sv.split(":")[1];vOf[k]=v;if(vStart[v]===undefined)vStart[v]=k;vEnd[v]=k});
  /* word state: 0 not yet, 1 recited, 2 missed, 3 shown by a hint */
  let startIdx=0,fixed=new Array(words.length).fill(0),last={st:fixed.slice(),pos:0},lastV=0,running=false,ended=false;
  const merged=al=>{const st=fixed.slice();for(let k=startIdx;k<st.length;k++)st[k]=al.st[k];return {st,pos:al.pos}};
  const score=al=>al.st.filter(x=>x===1).length*2+al.pos;
  const paint=(st,pos,done)=>{spans.forEach((s,k)=>{s.classList.toggle("ok",st[k]===1);s.classList.toggle("hinted",st[k]===3);s.classList.toggle("miss",st[k]===2||(done&&st[k]===0))});
    const curV=pos<spans.length?vOf[pos]:0;
    vEls.forEach(e=>{const v=+e.dataset.sv.split(":")[1];e.classList.toggle("cur",!done&&running&&v===curV)});
    const ok=st.filter(x=>x===1).length;$("#recStat").textContent=`${an(ok)} / ${an(words.length)}`;
    if(!done&&curV&&curV!==lastV){lastV=curV;const el=vEls.find(e=>+e.dataset.sv.split(":")[1]===curV);if(el){const q=el.getBoundingClientRect();if(q.top<90||q.bottom>innerHeight-170)el.scrollIntoView({block:"center",behavior:"smooth"})}}};
  const btnLabel=t=>{const s=$("#recBtn span");if(s)s.textContent=t};
  const setLive=on=>{running=on;document.body.classList.toggle("reclive",on);$("#recBtn").classList.toggle("live",on)};
  const result=()=>{const st=last.st,T=words.length,ok=st.filter(x=>x===1).length,err=T-ok;
    const allowed=strict?0:Math.max(1,Math.round(T*.1));return {ok,err,T,pass:err<=allowed}};
  const finish=()=>{stopRec();rec=null;setLive(false);ended=true;paint(last.st,last.pos,true);btnLabel("أعد");$("#recHeard").textContent="";
    const r=result(),res=$("#recRes");
    if(r.pass){const out=cb.onPass?cb.onPass():{};
      res.innerHTML=`<section class="card result ok"><b>${r.err?"أحسنت":"ما شاء الله، تسميع متقن"}</b><p>${an(r.ok)} من ${an(r.T)} كلمة صحيحة${r.err?` (${an(r.err)} ${r.err===1?"خطأ صغير":"أخطاء صغيرة"})`:""}.${out&&out.msg?`<br>${out.msg}`:""}</p>${out&&out.next?`<button class="btn gold" type="button" id="resNext">${out.next.label}</button>`:""}</section>`;
      if(out&&out.next)$("#resNext").onclick=out.next.go;toast(r.err?"أحسنت":"ما شاء الله")}
    else{if(cb.onFail)cb.onFail();
      res.innerHTML=`<section class="card result ko"><b>تحتاج إلى مراجعة</b><p>${an(r.err)} ${r.err===1?"كلمة":"كلمات"} لم تُقرأ صحيحة (بالأحمر). استمع إليها مرة أخرى ثم أعد التسميع.</p><div class="btns">${cb.onRetry?'<button class="btn gold" type="button" id="resListen">أعد الاستماع</button>':""}<button class="btn" type="button" id="resAgain">أعد المحاولة</button></div></section>`;
      if(cb.onRetry)$("#resListen").onclick=cb.onRetry;$("#resAgain").onclick=()=>reciteView(box,n,data,a,b,cb)}
    res.scrollIntoView({block:"center",behavior:"smooth"})};
  /* tap a verse to continue from it */
  $("#recText").onclick=e=>{const p=e.target.closest(".hzv");if(!p||!running)return;const v=+p.dataset.sv.split(":")[1];if(vStart[v]===undefined)return;
    startIdx=vStart[v];fixed=last.st.slice();for(let k=startIdx;k<fixed.length;k++)fixed[k]=0;lastV=0;last={st:fixed.slice(),pos:startIdx};paint(last.st,startIdx,false);
    if(rec){try{rec.r.abort()}catch(x){}}toast(`أتابع معك من الآية ${an(v)}`)};
  /* hint: show the next word (it counts as a small mistake) */
  $("#recHint").onclick=()=>{if(ended)return;const k=last.pos;if(k>=words.length)return;fixed=last.st.slice();fixed[k]=3;startIdx=k+1;last={st:fixed.slice(),pos:startIdx};paint(last.st,last.pos,false);
    if(startIdx>=words.length&&!SRC)finish()};
  const toWords=t=>t.split(/\s+/).filter(Boolean).map(skel).filter(Boolean);
  const commit=(ws,final)=>{const al=alignRec(ws,words,startIdx,final);for(let k=startIdx;k<al.pos;k++)fixed[k]=al.st[k];startIdx=al.pos;return final?ws.length:al.used};
  $("#recBtn").onclick=()=>{
    if(!SRC){if(ended){reciteView(box,n,data,a,b,cb);return}
      spans.forEach(s=>s.classList.add("peek"));box.querySelector(".recbar").outerHTML=`<div class="btns selfcheck"><button class="btn gold" type="button" id="scOk">قرأتها صحيحة</button><button class="btn" type="button" id="scKo">أخطأت</button></div>`;
      $("#scOk").onclick=()=>{last={st:new Array(words.length).fill(1),pos:words.length};ended=true;const out=cb.onPass?cb.onPass():{};$("#recRes").innerHTML=`<section class="card result ok"><b>أحسنت</b><p>${out&&out.msg||""}</p>${out&&out.next?`<button class="btn gold" type="button" id="resNext">${out.next.label}</button>`:""}</section>`;if(out&&out.next)$("#resNext").onclick=out.next.go};
      $("#scKo").onclick=()=>{if(cb.onFail)cb.onFail();if(cb.onRetry)cb.onRetry();else reciteView(box,n,data,a,b,cb)};return}
    if(rec){finish();return}
    if(player.s)stopAudio();
    if(ended){reciteView(box,n,data,a,b,cb);setTimeout(()=>{const nb=$("#recBtn");if(nb)nb.click()},50);return}
    lastV=0;last={st:fixed.slice(),pos:startIdx};setLive(true);paint(last.st,startIdx,false);$("#recHeard").textContent="أستمع إليك…";$("#recRes").innerHTML="";
    const r=new SRC();r.lang="ar-SA";r.continuous=true;r.interimResults=true;r.maxAlternatives=3;
    rec={r,want:true};btnLabel("إنهاء");
    /* recognised words are locked in, so new speech is only compared with the rest of the passage */
    const used={};
    r.onresult=e=>{let pending=[],raw=[];
      for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i],u=used[i]||0;
        let best=res[0].transcript,bs=-1;for(let j=0;j<res.length;j++){const t=res[j].transcript;const sc=score(alignRec(toWords(t).slice(u),words,startIdx,res.isFinal));if(sc>bs){bs=sc;best=t}}
        const ws=toWords(best),rest=ws.slice(Math.min(u,ws.length));
        if(res.isFinal){commit(rest,true);used[i]=ws.length}
        else{const k=rest.length>1?commit(rest.slice(0,-1),false):0;used[i]=Math.min(u,ws.length)+k;pending.push(...rest.slice(k));raw.push(...best.split(/\s+/).filter(Boolean).slice(used[i]))}}
      last=merged(alignRec(pending,words,startIdx,false));paint(last.st,last.pos,false);
      $("#recHeard").textContent=raw.join(" ");
      if(last.pos>=words.length||startIdx>=words.length)setTimeout(()=>{if(rec)finish()},350)};
    r.onerror=e=>{if(e.error==="no-speech"||e.error==="aborted")return;rec&&(rec.want=false);
      toast(e.error==="not-allowed"||e.error==="service-not-allowed"?"اسمح للمتصفح باستعمال الميكروفون والتعرّف على الكلام، ثم أعد المحاولة":"تعذّر التعرّف على الصوت. تحقّق من الاتصال وأعد المحاولة");
      btnLabel("ابدأ");setLive(false);rec=null};
    r.onend=()=>{for(const k in used)delete used[k];if(rec&&rec.want){try{r.start()}catch(e){setTimeout(()=>{if(rec&&rec.want)try{r.start()}catch(x){}},250)}}};
    try{r.start()}catch(e){toast("تعذّر تشغيل الميكروفون");rec=null;setLive(false);btnLabel("ابدأ")}
  };
}

/* step 3 — review: the whole surah, up to my position, the last verses before it, or a chain to An-Nas */
let rvChain=null;
function drawReview(n,data){
  const N=data.v.length,L=hzLearned(n,N),body=$("#hzBody"),cur=HZ[n]&&HZ[n].st===1;
  let mode=store.get("rvmode","full");if((mode==="upto"||mode==="last")&&!(cur&&L>0))mode="full";
  const k=[3,5,10].includes(store.get("rvlast",3))?store.get("rvlast",3):3,reps=[1,3,5,7].includes(store.get("rvreps",1))?store.get("rvreps",1):1;
  const opt=(m,t,sub,dis)=>`<button type="button" class="rvopt" data-m="${m}" aria-pressed="${mode===m}" ${dis?"disabled":""}><i></i><span><b>${t}</b><small>${sub}</small></span></button>`;
  const lastA=Math.max(1,L-k+1);
  body.innerHTML=`<section class="card rvcard">
      <div class="rvopts">
        ${opt("full","السورة كاملة",`الآيات ${an(1)} – ${an(N)}`)}
        ${opt("upto","من البداية إلى موضعي",cur&&L>0?`الآيات ${an(1)} – ${an(L)}`:"حين تبدأ حفظ هذه السورة",!(cur&&L>0))}
        ${opt("last","آخر ما حفظت",cur&&L>0?`الآيات ${an(lastA)} – ${an(L)}`:"حين تبدأ حفظ هذه السورة",!(cur&&L>0))}
        ${opt("chain","تسلسل حتى سورة الناس",n>=114?"هذه آخر سورة":`${META[n-1][1]} ثم ${n+1<114?`${META[n][1]}، ${META[n+1][1]}… حتى الناس`:"الناس"}`)}
      </div>

      const s=m[0],on=modeP==="many"?sel.has(s):s===cur,tag=modeP==="one"&&HZ[s]&&HZ[s].st===2?'<span class="pill mem">محفوظة</span>':"";

  $("#pkOrd").onclick=()=>{save("order",store.get("order","asc")==="desc"?"asc":"desc");ordLbl();draw();$("#pkList").scrollTop=0};
  draw();pk.hidden=false;$("#pscrim").hidden=false;

  $("#pkList").onclick=e=>{const x=e.target.closest(".pkrow");if(!x)return;const s=+x.dataset.s;
    if(modeP==="one"){const prev=setCurrent(s);closePicker();toast(prev?`سورتك الحالية الآن: ${META[s-1][1]} (أُزيلت ${META[prev-1][1]})`:`سورتك الحالية: ${META[s-1][1]}`);renderHifzHome();return}
    if(sel.has(s))sel.delete(s);else sel.add(s);x.classList.toggle("on");x.setAttribute("aria-pressed",String(sel.has(s)));$("#pkSave").textContent=`حفظ (${an(sel.size)} سورة)`};
  const qk=$("#pkQuick");if(qk)qk.onclick=e=>{const x=e.target.closest("[data-r]");if(!x)return;if(x.dataset.r==="clear")sel.clear();else{const [a,b]=x.dataset.r.split("-").map(Number);for(let s=a;s<=b;s++)sel.add(s)}draw()};
  const sv=$("#pkSave");if(sv)sv.onclick=()=>{let i=0,added=0,removed=0;
    Object.keys(HZ).map(Number).forEach(s=>{if(HZ[s].st===2&&!sel.has(s)){delete HZ[s];removed++}});

const CNT="https://abacus.jasoncameron.dev",CNS="mushaf-tadabbur";
const cday=d=>"day-"+d.toISOString().slice(0,10).replace(/-/g,"");
/* each request gives up after 6 s, so one slow answer never blocks the page */
async function cget(k){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),6000);
  try{const r=await fetch(`${CNT}/get/${CNS}/${k}`,{cache:"no-store",signal:ac.signal});if(r.status===404)return 0;if(!r.ok)return null;return +(await r.json()).value||0}catch(e){return null}finally{clearTimeout(t)}}

/* ---------- Routing ---------- */
function go(s,v){$("#panel").hidden=true;closeSheet();
  if(mode==="pages"){const p=pageOf(s,v);pendingFlash=v>1?[s,v]:null;const h="p"+p;if(location.hash==="#"+h)route();else location.hash=h;return}
  const h="s"+s+"-"+v;if(location.hash==="#"+h)route();else location.hash=h}
document.addEventListener("click",e=>{const pb=e.target.closest("[data-page]");if(pb&&!pb.disabled){closeSheet();const np=+pb.dataset.page;if(curPage&&Math.abs(np-curPage)===1){swipeDir=np-curPage;pageSound();location.replace("#p"+np)}else location.hash="p"+np;return}
  const bm=e.target.closest("[data-bas]");if(bm&&!bm.closest("#pbody")){basTap(+bm.dataset.bas);return}
  const b=e.target.closest("[data-go]");if(!b)return;const [s,v]=b.dataset.go.split("-").map(Number);go(s,v)});
function basTap(n){if(player.s===n&&player.bas){stopAudio();return}playVerse(n,1,{bas:true})}
$("#home").onclick=()=>{if(location.hash){location.hash=""}else renderHome()};
function route(){closeMenu();closePicker();stopRec();rec=null;const pm=location.hash.match(/^#p(\d{1,3})$/);if(pm){renderPage(+pm[1]);return}
  curPage=0;document.documentElement.classList.remove("pagemode");
  const h=location.hash;
  if(h==="#admin"){closeSheet();stopAudio();current=0;renderAdmin();return}
  if(h==="#marks"){closeSheet();current=0;curPage=0;renderMarks();return}
  if(h==="#stats"||h==="#hifz"||h==="#prefs"){closeSheet();stopAudio();current=0;({"#stats":renderStats,"#hifz":renderHifzHome,"#prefs":renderPrefs})[h]();return}
  const hz=h.match(/^#hifz-(\d{1,3})$/);if(hz&&+hz[1]>=1&&+hz[1]<=114){closeSheet();stopAudio();current=0;renderHifzSurah(+hz[1]);return}
  closeSheet();const m=location.hash.match(/^#s(\d{1,3})-(\d{1,3})$/);
  /* in mushaf mode a verse address (Back button, old link, audio crossing a surah) opens its page, never the line view */
  if(m&&mode==="pages"&&+m[1]>=1&&+m[1]<=114){const s=+m[1],v=Math.max(1,Math.min(+m[2],META[s-1][4]));pendingFlash=v>1?[s,v]:null;location.replace("#p"+pageOf(s,v));return}
  if(m&&+m[1]>=1&&+m[1]<=114)renderSurah(+m[1],+m[2]);else{current=0;stopAudio();renderHome()}}
window.addEventListener("hashchange",route);
const prog=$("#progress"),toTop=$("#toTop");
function onScroll(){if(curPage){prog.hidden=false;prog.firstChild.style.width=(curPage/604*100)+"%";toTop.hidden=scrollY<900;return}
  const reading=!!current&&!!$("#verses");prog.hidden=!reading;
  const h=document.documentElement.scrollHeight-innerHeight;const p=h>0?Math.min(1,scrollY/h):0;
  if(reading)prog.firstChild.style.width=(p*100)+"%";toTop.hidden=scrollY<900}
addEventListener("scroll",onScroll,{passive:true});
toTop.onclick=()=>scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
setInterval(onScroll,1000);
updateModeBtn();
route();
connectCloud();

try{if(STANDALONE&&/\.vercel\.app$/.test(location.hostname)){

  if(!store.get("owner",0)&&location.hash!=="#admin"){const hit=k=>fetch(`${CNT}/hit/${CNS}/${k}`,{keepalive:true}).catch(()=>{});
