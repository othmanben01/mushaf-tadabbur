/* ---------- Home-screen install: no Safari bars, full-screen mushaf ---------- */
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
const isInstalled=()=>navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;
let installEvt=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(!current&&!curPage&&!location.hash)installCard()});
/* the home-screen app has its own storage on iPhone: the address it is added with carries this browser's progress and settings */
function carryData(){try{const d={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("mt_")&&k!=="mt_owner"&&k!=="mt_counted"&&k!=="mt_cday")d[k]=localStorage.getItem(k)}
  if(!Object.keys(d).length)return;const enc=btoa(unescape(encodeURIComponent(JSON.stringify(d)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  history.replaceState(null,"",location.pathname+"#mig="+enc)}catch(e){}}

const DOTS_IC=`<b>⋮</b>`;
const INST={
 ar:{dir:"rtl",tab:"العربية",t:"ثبّت مصحف التدبر على هاتفك",p:"مجاني، يفتح بملء الشاشة بلا أشرطة المتصفح، ويعمل دون إنترنت. وتنتقل معه قراءتك وإعداداتك.",

 fr:{dir:"ltr",tab:"Français",t:"Installez Mushaf Tadabbur sur votre téléphone",p:"Gratuite, elle s’ouvre en plein écran sans les barres du navigateur et fonctionne hors connexion. Votre lecture et vos réglages suivent.",

function installHelp(){
  if(STANDALONE)carryData();
  const isAnd=/Android/i.test(navigator.userAgent);
  let lang=store.get("instlang","ar");if(!INST[lang])lang="ar";
  const box=document.createElement("div");box.className="instov";
  const draw=()=>{const L=INST[lang];
    const steps=(arr)=>`<ol>${arr.map(x=>`<li>${x}</li>`).join("")}</ol>`;
    const body=isInstalled()?`<p class="instdone">${L.done}</p>`:
      (installEvt?`<button class="btn gold instgo" type="button">${L.go}</button>`:"")+
      (isIOS?steps(L.ios):isAnd?steps(L.and):`<h4>${L.ios_h}</h4>${steps(L.ios)}<h4>${L.and_h}</h4>${steps(L.and)}`);
    box.innerHTML=`<div class="instbox" role="dialog" aria-label="${L.t}" dir="${L.dir}" lang="${lang}">
      <div class="seg sm insttabs" role="tablist">${Object.keys(INST).map(k=>`<button type="button" role="tab" data-l="${k}" aria-pressed="${k===lang}">${INST[k].tab}</button>`).join("")}</div>
      <div class="insthead"><img src="apple-touch-icon.png" alt=""><h3>${L.t}</h3></div><p>${L.p}</p>${body}
      <button class="btn instok" type="button">${L.ok}</button></div>`;
    box.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set("instlang",lang);draw()});
    const g=box.querySelector(".instgo");if(g)g.onclick=()=>{installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;const c=$("#instCard");if(c)c.remove();close()})};
    box.querySelector(".instok").onclick=close};
  const close=()=>{box.remove();if(/^#mig=/.test(location.hash))history.replaceState(null,"",location.pathname)};
  draw();document.body.appendChild(box);box.onclick=e=>{if(e.target===box)close()};setTimeout(()=>{if(box.isConnected)close()},300000)}
function installCard(){
  if(!STANDALONE||isInstalled()||store.get("instno",0)||store.get("instnudges",0)>=3||Date.now()<store.get("instsnooze",0)||$("#instCard")||!(isIOS||installEvt))return;
  const w=document.querySelector("#view .wrap");if(!w)return;
  const c=document.createElement("section");c.className="card instcard";c.id="instCard";
  c.innerHTML=`<img class="instic" src="apple-touch-icon.png" alt=""><div><b>ثبّت التطبيق على هاتفك</b><span>مجاني، يفتح بملء الشاشة ويعمل دون إنترنت.</span></div><button class="btn" type="button" id="instGo">ثبّت</button><button class="instx" type="button" aria-label="إخفاء">×</button>`;
  w.prepend(c);$("#instGo").onclick=installHelp;/* «×»: hidden for 3 days; after 3 refusals it does not come back */
  c.querySelector(".instx").onclick=()=>{store.set("instsnooze",Date.now()+3*864e5);store.set("instnudges",store.get("instnudges",0)+1);c.remove()}}
{const _rh=renderHome;renderHome=function(){_rh.apply(this,arguments);installCard()};if(!current&&!curPage&&!/^#./.test(location.hash))installCard()}
/* a gentle notice a few seconds after opening, on any screen: «install the app»; «later» hides it for 3 days, twice «later» for good */
function installNudge(){
  if(!STANDALONE||isInstalled()||!(isIOS||installEvt)||$("#instNudge")||$(".instov"))return;
  const until=store.get("instsnooze",0),n=store.get("instnudges",0);if(n>=3||Date.now()<until)return;
  const b=document.createElement("div");b.className="instnudge";b.id="instNudge";b.setAttribute("role","dialog");b.setAttribute("aria-label","تثبيت التطبيق");
  b.innerHTML=`<img src="apple-touch-icon.png" alt=""><div><b>مصحف التدبر على هاتفك</b><span>ثبّته كتطبيق: مجاني، بملء الشاشة، ويعمل دون إنترنت</span></div><button class="btn gold" type="button">تثبيت</button><button class="instx" type="button" aria-label="لاحقًا">×</button>`;
  document.body.appendChild(b);requestAnimationFrame(()=>b.classList.add("in"));
  const close=()=>{b.classList.remove("in");setTimeout(()=>b.remove(),300)};
  b.querySelector(".btn").onclick=()=>{close();installHelp()};
  b.querySelector(".instx").onclick=()=>{store.set("instsnooze",Date.now()+3*864e5);store.set("instnudges",n+1);close()};
  setTimeout(()=>{if(b.isConnected)close()},20000)}
